name: mirror-to-github

# Gitea is the source of truth. On a release tag pushed to Gitea this pushes the
# tag, and the branch the release belongs to, on to the GitHub org repo, a
# code-only mirror (its Actions are off; releases are built here on Gitea).
# Branch pushes do not run it: GitHub follows releases, not every commit. A tag
# vX.Y.Z moves GitHub's main to the tagged commit, vX.Y.Z-nightly moves nightly.
#
# It is deliberately NOT Gitea's built-in push mirror. That runs
# `git push --mirror`, which deletes every ref GitHub has and Gitea lacks:
# gh-pages and the tags that `gh release create` makes. Here the tag and its branch
# are pushed, never forced and never deleted. A non-fast-forward is rejected and fails this
# job, so a diverged GitHub branch is seen, not overwritten.
#
# Only the tags listed under `on.push`, and main and nightly through them,
# reach the PUBLIC GitHub repo. Every other branch stays on Gitea.
#
# Only the pushed commit is fetched at first (this repo's history is 2.3 GB, and
# a full clone on every push took longer than the job allows). GitHub already
# holds the history, so it usually needs only the new commit. When GitHub's
# branch is further behind (a release that failed to mirror), the job deepens
# the clone until it holds GitHub's tip, so the push connects to GitHub's
# history, and a missed release heals itself on the next release tag. If the
# whole history is fetched and GitHub's tip is still not in it, GitHub's branch
# has diverged and the job fails without pushing.
#
# MIRROR_GITHUB_TOKEN needs `repo` and `workflow` (classic) or Contents and
# Workflows write (fine-grained): a commit touching .github/workflows is
# rejected without the workflow scope.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: mirror-to-github
  cancel-in-progress: false

jobs:
  mirror:
    name: Push to GitHub
    runs-on: orama
    timeout-minutes: 30
    env:
      MIRROR_URL: https://github.com/Orama-Network/orama.git
      MIRROR_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
      PUSHED_REF: ${{ github.ref }}
      PUSHED_SHA: ${{ github.sha }}
      # Commits fetched per round while looking for GitHub's tip.
      DEEPEN_STEP: "200"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Push the ref to GitHub
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "::error::secret MIRROR_GITHUB_TOKEN is not set on this repository"
            exit 1
          fi
          [[ "${PUSHED_REF}" =~ ^refs/tags/v[0-9A-Za-z._-]+$ ]] || { echo "::error::unexpected ref '${PUSHED_REF}'"; exit 1; }
          [[ "${PUSHED_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected sha '${PUSHED_SHA}'"; exit 1; }
          branch=main
          [[ "${PUSHED_REF}" == *-nightly ]] && branch=nightly
          AUTH="$(printf 'x-access-token:%s' "${MIRROR_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${AUTH}"
          github() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="Authorization: Basic ${AUTH}" git "$@"
          }
          tip="$(github ls-remote "${MIRROR_URL}" "refs/heads/${branch}" | cut -f1)"
          if [ -n "${tip}" ]; then
            until git cat-file -e "${tip}^{commit}" 2>/dev/null; do
              if [ "$(git rev-parse --is-shallow-repository)" = false ]; then
                echo "::error::GitHub's ${branch} (${tip}) is not in this repository's history: it has diverged"
                exit 1
              fi
              git fetch --quiet --no-tags --deepen="${DEEPEN_STEP}" origin "${PUSHED_REF}"
            done
          fi
          github push "${MIRROR_URL}" "${PUSHED_SHA}:${PUSHED_REF}" "${PUSHED_SHA}:refs/heads/${branch}"
