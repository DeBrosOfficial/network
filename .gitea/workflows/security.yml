# Orama baseline security CI workflow (orama-specific).
#
# Runs supply-chain + vulnerability checks per the Orama baseline rules.
# Triggers on release tags, PRs to main, on demand, and weekly to catch
# newly-published CVEs. Not on branch pushes.
#

name: security

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    # Weekly scan even on quiet weeks — catches newly-published CVEs
    # in existing dependencies.
    - cron: "0 8 * * 1"

# Each job gets its own tool cache. The runner's act-toolcache volume is shared
# by every job on a host, and @actions/tool-cache empties a version's directory
# before filling it, so jobs installing a new Go or Node at the same moment
# delete each other's files (ENOENT, then a half-installed toolchain).
env:
  RUNNER_TOOL_CACHE: /tmp/toolcache

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # JavaScript / TypeScript (sdk/)
  # ------------------------------------------------------------------
  npm-audit:
    runs-on: orama
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify lockfile committed
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::sdk/pnpm-lock.yaml must be committed"
            exit 1
          fi

      - name: Verify .npmrc blocks install scripts
        run: |
          if ! grep -q '^ignore-scripts=true' .npmrc 2>/dev/null; then
            echo "::error::sdk/.npmrc must contain 'ignore-scripts=true'"
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: sdk/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production deps
        run: pnpm audit --prod --audit-level=high

  # ------------------------------------------------------------------
  # Go (core/)
  # ------------------------------------------------------------------
  go-vuln:
    runs-on: orama
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify go.sum committed
        run: |
          if [ ! -f go.sum ]; then
            echo "::error::core/go.sum must be committed"
            exit 1
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Verify modules
        run: go mod verify

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        run: govulncheck ./...
