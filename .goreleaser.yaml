# GoReleaser v2 Configuration for Orama Network
# Builds and releases orama (CLI) and orama-node binaries.
# Publishes to Gitea Releases: the binaries, the .deb packages and the tar.gz
# archives all ride the release as downloadable assets (no separate apt repo).
# Gitea is the source of truth; GitHub is a code-only mirror (no Actions).

version: 2
project_name: orama-network

# The Gitea instance GoReleaser creates the release and uploads assets on.
# GITEA_TOKEN (a package+repository write token) authenticates the upload.
gitea_urls:
  api: https://git.icxcnika.io/api/v1
  download: https://git.icxcnika.io

env:
  - GO111MODULE=on

before:
  hooks:
    - go -C core mod tidy

builds:
  # orama CLI binary
  - id: orama
    dir: core
    main: ./cmd/orama
    binary: orama
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # orama-node binary (Linux only for apt)
  - id: orama-node
    dir: core
    main: ./cmd/node
    binary: orama-node
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Tar.gz archives for orama CLI
  - id: orama-archives
    ids:
      - orama
    formats: [tar.gz]
    name_template: "orama_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

  # Tar.gz archives for orama-node
  - id: orama-node-archives
    ids:
      - orama-node
    formats: [tar.gz]
    name_template: "orama-node_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

# Debian packages for apt
nfpms:
  # orama CLI .deb package
  - id: orama-deb
    package_name: orama
    ids:
      - orama
    vendor: Orama Network
    homepage: https://git.icxcnika.io/ICXCNIKA/orama
    maintainer: Orama Network <info@orama.network>
    description: CLI tool for the Orama decentralized network
    license: MIT
    formats:
      - deb
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: ./README.md
        dst: /usr/share/doc/orama/README.md
    deb:
      lintian_overrides:
        - statically-linked-binary

  # orama-node .deb package
  - id: orama-node-deb
    package_name: orama-node
    ids:
      - orama-node
    vendor: Orama Network
    homepage: https://git.icxcnika.io/ICXCNIKA/orama
    maintainer: Orama Network <info@orama.network>
    description: Node daemon for the Orama decentralized network
    license: MIT
    formats:
      - deb
    bindir: /usr/bin
    section: net
    priority: optional
    contents:
      - src: ./README.md
        dst: /usr/share/doc/orama-node/README.md
    deb:
      lintian_overrides:
        - statically-linked-binary

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  abbrev: -1
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  gitea:
    owner: ICXCNIKA
    name: orama
  draft: false
  prerelease: auto
  name_template: "Release {{.Version}}"
